name: Generate Tokens

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  generate-tokens:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FONDUE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FONDUE_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build tokens
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: pnpm build:tokens

      - name: Check for changes
        id: git_diff
        run: |
          if git diff --quiet; then
            echo "No changes detected after building tokens."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected after building tokens."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create changeset
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .changeset
          echo -e "---\n'@frontify/fondue-tokens': patch\n---\n\nUpdated Tokens from Figma" > .changeset/automated-tokens.md
          git add .changeset/automated-tokens.md

      - name: Create Pull Request
        if: steps.git_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(tokens): update design tokens"
          title: "chore(tokens): Update design tokens"
          body: |
            This PR updates the design tokens based on the latest changes.

            This is an automated PR.
          branch: chore/tokens/update-generated-tokens
          labels: automated pr, fondue
          signoff: true
