name: Update Icons

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Run every Monday at midnight UTC

permissions:
  contents: read

jobs:
  update-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FONDUE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FONDUE_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-members: read

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate icons
        run: pnpm --stream --filter {packages/icons} build:download-new-icons
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Check for changes
        id: git-check
        run: |
          git add .
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Unique Changeset
        if: steps.git-check.outputs.changes == 'true'
        id: create-changeset
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          CHANGESET_FILE=".changeset/update-icons-${TIMESTAMP}.md"
          echo "---
          '@frontify/fondue-icons': minor
          ---

          feat: update icons" > "$CHANGESET_FILE"

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "feat: update icons"
          title: "feat: update icons"
          body: |
            This PR updates the icons using the latest changes.

            Auto-generated by GitHub Actions.
          branch: update-icons
          base: main
          team-reviewers: frontify/frontend-platform

      - name: No changes
        if: steps.git-check.outputs.changes != 'true'
        run: echo "No changes to commit. Skipping PR creation."
