name: Fondue CI

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/fondue-pull-requests.yaml
      - packages/**
      - .npmrc
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/check-bundle-size.mjs

# Ensures that only one workflow per branch will run at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue Icons & Components
        uses: ./.github/actions/build-packages
        with:
          icons: "true"
          components: "true"

      - name: Build Fondue Charts
        run: pnpm build:charts

      - name: Build Fondue RTE
        run: pnpm build:rte

      - name: Build Fondue SDK
        run: pnpm build:sdk

      - name: Lint code
        run: pnpm --stream --filter {packages/fondue} --filter {packages/components} --filter {packages/icons} --filter {packages/rte} --filter {packages/sdk} lint

      - name: Typecheck code
        run: pnpm --stream --filter {packages/fondue} --filter {packages/components} --filter {packages/icons} --filter {packages/rte} --filter {packages/sdk} typecheck

      # Runs here rather than in its own job: the tests take ~1s, a separate job spent ~30s on setup.
      - name: SDK unit tests
        run: pnpm --stream --filter {packages/sdk} test

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue Icons & Components
        uses: ./.github/actions/build-packages
        with:
          icons: "true"
          components: "true"

      - name: Build Fondue Rich Text Editor
        run: pnpm --stream --filter {packages/rich-text-editor} build

      - name: Check bundle sizes
        run: pnpm check:bundle-size

  rte-component-tests:
    name: RTE Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress-cache: "true"

      - name: Build Fondue Icons & Components
        uses: ./.github/actions/build-packages
        with:
          icons: "true"
          components: "true"

      - name: Component Tests
        uses: ./.github/actions/cypress-shard
        with:
          package: packages/rte
          shard: ${{ matrix.shard }}
          total: ${{ strategy.job-total }}

  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue Icons
        uses: ./.github/actions/build-packages
        with:
          icons: "true"

      - name: Unit test
        run: pnpm --stream --filter {packages/components} test

  component-tests:
    name: Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Build Fondue Icons
        uses: ./.github/actions/build-packages
        with:
          icons: "true"

      - name: Playwright tests
        run: pnpm --filter {packages/components} exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
