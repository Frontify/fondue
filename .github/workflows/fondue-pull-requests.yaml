name: Fondue CI

on:
  pull_request:
    paths:
      - packages/**
      - .npmrc
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

# Ensures that only one workflow per branch will run at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue Icons
        run: pnpm build:icons

      - name: Build Fondue Charts
        run: pnpm build:charts

      - name: Build Fondue Components
        run: pnpm build:components

      - name: Build Fondue RTE
        run: pnpm build:rte

      - name: Build Fondue SDK
        run: pnpm build:sdk

      - name: Lint code
        run: pnpm --stream --filter {packages/fondue} --filter {packages/components} --filter {packages/icons} --filter {packages/rte} --filter {packages/sdk} lint

      - name: Typecheck code
        run: pnpm --stream --filter {packages/fondue} --filter {packages/components} --filter {packages/icons} --filter {packages/rte} --filter {packages/sdk} typecheck

  rte-component-tests:
    name: RTE Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress-cache: "true"

      - name: Build Fondue Icons
        run: pnpm build:icons

      - name: Build Fondue Components
        run: pnpm build:components

      - name: Component Tests
        uses: ./.github/actions/cypress-shard
        with:
          package: packages/rte
          shard: ${{ matrix.shard }}
          total: ${{ strategy.job-total }}

  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue icons
        run: pnpm build:icons

      - name: Unit test
        run: pnpm --stream --filter {packages/components} test

  component-tests:
    name: Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup
        with:
          playwright-cache: "true"

      - name: Build Fondue icons
        run: pnpm build:icons

      - name: Install Playwright browsers
        run: pnpm --stream --filter {packages/components} install:playwright

      - name: Playwright tests
        run: pnpm --filter {packages/components} exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  rich-text-editor-checks:
    name: Rich Text Editor Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue icons
        run: pnpm build:icons

      - name: Build Fondue components
        run: pnpm build:components

      - name: Lint code
        run: pnpm --stream --filter {packages/rich-text-editor} lint

      - name: Check formatting
        run: pnpm --stream --filter {packages/rich-text-editor} format:check

      - name: Typecheck code
        run: pnpm --stream --filter {packages/rich-text-editor} typecheck

      - name: Build
        run: pnpm build:rich-text-editor

      # Each guard script runs here, so a new `scripts/check-*.ts` needs no workflow change.
      # Skips check-qualification.ts (release workflow only) and `*.test.ts` guard tests.
      - name: Guard scripts
        working-directory: packages/rich-text-editor
        run: |
          ran=0
          for script in scripts/check-*.ts; do
            if [ "$script" = scripts/check-qualification.ts ] || [[ "$script" == *.test.ts ]]; then
              continue
            fi
            echo "::group::$script"
            pnpm exec tsx "$script"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::No guard script ran"
            exit 1
          fi
          echo "Ran $ran guard scripts"

  rich-text-editor-unit-tests:
    name: Rich Text Editor Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup
        with:
          playwright-cache: "true"

      - name: Build Fondue icons
        run: pnpm build:icons

      - name: Build Fondue components
        run: pnpm build:components

      # The lint fixture, typecheck fixture and Playwright config tests run in this job.
      # Install every browser so the shared Playwright cache always holds all three.
      - name: Install Playwright browsers
        run: pnpm --stream --filter {packages/rich-text-editor} install:playwright

      - name: Unit test
        run: pnpm --stream --filter {packages/rich-text-editor} test

  rich-text-editor-component-tests:
    name: Rich Text Editor Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup
        with:
          playwright-cache: "true"

      - name: Build Fondue icons
        run: pnpm build:icons

      - name: Build Fondue components
        run: pnpm build:components

      - name: Install Playwright browsers
        run: pnpm --stream --filter {packages/rich-text-editor} install:playwright

      # The hydration tests render the built package in Node.
      - name: Build the editor
        run: pnpm build:rich-text-editor

      - name: Playwright tests
        run: pnpm --filter {packages/rich-text-editor} exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  rich-text-editor-storybook-tests:
    name: Rich Text Editor Storybook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup
        with:
          playwright-cache: "true"

      - name: Build Fondue icons
        run: pnpm build:icons

      - name: Build Fondue components
        run: pnpm build:components

      - name: Install Playwright browsers
        run: pnpm --stream --filter {packages/rich-text-editor} install:playwright

      - name: Build Storybook
        run: pnpm --stream --filter {packages/rich-text-editor} build:storybook

      # Every story must carry its status tag before the tests start.
      - name: Check story status
        run: pnpm --stream --filter {packages/rich-text-editor} check:story-status

      # Runs every story, with the axe and toolbar global checks of `.storybook/preview.tsx` after each one.
      - name: Storybook tests
        run: pnpm --stream --filter {packages/rich-text-editor} test:storybook:ci

      # Development React keeps its hydration mismatch warnings (SPEC-rich-text-output/AC-010).
      - name: Build the editor
        run: pnpm build:rich-text-editor

      - name: Reader hydration tests
        run: pnpm --stream --filter {packages/rich-text-editor} test:components:hydration

  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Unit test
        run: pnpm --stream --filter {packages/sdk} test
