name: Git AI

on:
  pull_request:
    types: [closed, synchronize]

jobs:
  git-ai:
    if: github.event.pull_request.merged == true || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # To upgrade: bump GIT_AI_VERSION, download the git-ai-linux-x64 release asset
      # locally, recompute `shasum -a 256`, and update GIT_AI_SHA256 in the same PR.
      - name: Install git-ai (pinned, checksum-verified)
        env:
          GIT_AI_VERSION: v1.6.11
          GIT_AI_SHA256: 8f9e0b12e5f7e5298cf2bd3100843d6e7801f8b4321008db9db24c98c9229b45
        run: |
          mkdir -p "$HOME/.git-ai/bin"
          curl -fsSL --retry 3 -o "$HOME/.git-ai/bin/git-ai" \
            "https://github.com/git-ai-project/git-ai/releases/download/${GIT_AI_VERSION}/git-ai-linux-x64"
          echo "${GIT_AI_SHA256}  $HOME/.git-ai/bin/git-ai" | sha256sum -c -
          chmod +x "$HOME/.git-ai/bin/git-ai"
          echo "$HOME/.git-ai/bin" >> "$GITHUB_PATH"
      - name: Run git-ai
        id: run-git-ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git-ai ci github run
      # git-ai stores attribution as git notes, so we clone fresh, fetch the
      # notes refs plus the PR head ref (which outlives branch deletion), and
      # render `git-ai stats` for the PR's commit range into the job summary.
      - name: AI attribution stats
        if: always() && steps.run-git-ai.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          clone_dir="$RUNNER_TEMP/git-ai-stats"
          git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$clone_dir"
          cd "$clone_dir"
          git fetch --quiet origin \
            "+refs/pull/${PR_NUMBER}/head:refs/heads/git-ai-stats-pr-head" \
            "+refs/notes/*:refs/notes/*"
          git checkout --quiet git-ai-stats-pr-head

          # git-ai's range form (`stats A..B`) does NOT attribute human authorship in
          # v1.6.11 — it buckets human-authored lines into `unknown_additions`. The
          # per-commit form (`stats <sha>`) reads each commit's authorship note
          # correctly, so we sum per-commit stats across the PR's commits instead.
          # Caveat: a line edited in N commits is counted N times, so these totals can
          # slightly exceed the net PR diff. Revisit if a newer git-ai fixes the range
          # form's human attribution, in which case a single `stats A..B` would do.
          stats="$(git rev-list "${BASE_SHA}..${HEAD_SHA}" \
            | while read -r sha; do git-ai stats "$sha" --json 2>/dev/null || true; done \
            | jq -s '
              reduce .[] as $c (
                {human:0, unknown:0, ai:0, ai_accepted:0, added:0, deleted:0, commits:0, tools:{}};
                .human        += ($c.human_additions // 0)
                | .unknown    += ($c.unknown_additions // 0)
                | .ai         += ($c.ai_additions // 0)
                | .ai_accepted += ($c.ai_accepted // 0)
                | .added      += ($c.git_diff_added_lines // 0)
                | .deleted    += ($c.git_diff_deleted_lines // 0)
                | .commits    += 1
                | .tools      += (reduce (($c.tool_model_breakdown // {}) | to_entries[]) as $t
                    (.tools;
                      .[$t.key].ai_additions = ((.[$t.key].ai_additions // 0) + ($t.value.ai_additions // 0))
                      | .[$t.key].ai_accepted = ((.[$t.key].ai_accepted // 0) + ($t.value.ai_accepted // 0))))
              )')"
          echo "$stats"

          if [ "$(echo "$stats" | jq '(.human // 0) + (.ai // 0) + (.unknown // 0)')" -eq 0 ]; then
            echo "### 🤖 AI attribution — PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No git-ai attribution data found for \`${BASE_SHA}..${HEAD_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### 🤖 AI attribution — PR #${PR_NUMBER}"
            echo ""
            echo "$stats" | jq -r '
              (.ai // 0) as $ai
              | (.human // 0) as $human
              | (.unknown // 0) as $unknown
              | ($ai + $human + $unknown) as $total
              | "| Metric | Value |",
                "| --- | --- |",
                "| AI-authored lines | \($ai) |",
                "| Human-authored lines | \($human) |",
                "| Unattributed lines | \($unknown) |",
                "| AI share of additions | \(if $total > 0 then ((100 * $ai / $total) | round | tostring) + "%" else "n/a" end) |",
                "| AI lines accepted | \(.ai_accepted // 0) |",
                "| Diff lines added / deleted | \(.added // 0) / \(.deleted // 0) |",
                "| Commits counted | \(.commits // 0) |"
            '
            echo ""
            echo "_Attribution is summed per commit; a line edited in several commits is counted once per commit, so totals may slightly exceed the net PR diff._"
            echo ""
            echo "$stats" | jq -r '
              (.tools // {}) as $tools
              | if ($tools | length) > 0 then
                  "#### By tool and model",
                  "",
                  "| Tool / model | AI additions | Accepted |",
                  "| --- | --- | --- |",
                  ($tools | to_entries[] | "| \(.key) | \(.value.ai_additions // 0) | \(.value.ai_accepted // 0) |")
                else empty end
            '
          } >> "$GITHUB_STEP_SUMMARY"
