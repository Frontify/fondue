name: Continuous Deployment

on:
  push:
    branches:
      - main
      - v14

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue Icons & Components
        uses: ./.github/actions/build-packages
        with:
          icons: "true"
          components: "true"

      - name: Build Fondue Charts
        run: pnpm build:charts

      - name: Build Fondue RTE
        run: pnpm build:rte

      - name: Build Fondue Rich Text Editor
        run: pnpm build:rich-text-editor

      - name: Build Fondue SDK
        run: pnpm build:sdk

      - name: Lint code
        run: pnpm lint

      - name: Typecheck code
        run: pnpm typecheck

  rte-component-tests:
    name: RTE Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress-cache: "true"

      - name: Build Fondue Icons & Components
        uses: ./.github/actions/build-packages
        with:
          icons: "true"
          components: "true"

      - name: Component Tests
        uses: ./.github/actions/cypress-shard
        with:
          package: packages/rte
          shard: ${{ matrix.shard }}
          total: ${{ strategy.job-total }}

  component-unit-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Fondue Icons
        uses: ./.github/actions/build-packages
        with:
          icons: "true"

      - name: Unit test
        run: pnpm --stream --filter {packages/components} test

  component-tests:
    name: Component Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Build Fondue Icons
        uses: ./.github/actions/build-packages
        with:
          icons: "true"

      - name: Playwright tests
        run: pnpm --filter {packages/components} exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: [lint-typecheck, component-unit-tests, component-tests]

    permissions:
      contents: write # to create release (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
      id-token: write # to authenticate with npm registry via OIDC

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FONDUE_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FONDUE_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          commit: "chore: release packages"
          title: "chore: release packages"
          createGithubReleases: true
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
          # Use OIDC for npm authentication instead of NPM_TOKEN
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
