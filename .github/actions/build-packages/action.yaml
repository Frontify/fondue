name: Build packages
description: Build fondue-icons and/or fondue-components, restoring each package's output from its own cache when its inputs are unchanged.

inputs:
  icons:
    description: When 'true', build fondue-icons.
    required: false
    default: "false"
  components:
    description: When 'true', build fondue-components. Requires icons to be 'true' as well, since the build reads icons' dist.
    required: false
    default: "false"

# Each package has its own cache key, so a components-only change still restores icons.
# A key is the git hash of the committed paths the build reads: a package folder's hash changes
# when any committed file in it changes, and ignores node_modules, dist and generated files.
# Bump the v1 prefix to invalidate all entries.
runs:
  using: composite
  steps:
    - name: Validate inputs
      if: inputs.components == 'true' && inputs.icons != 'true'
      shell: bash
      run: |
        echo "::error::build-packages: 'components' needs 'icons: \"true\"' because the components build reads packages/icons/dist."
        exit 1

    - name: Compute cache keys
      id: keys
      shell: bash
      run: |
        # Prints one hash for the given paths as committed in HEAD; fails if a path is missing.
        hash_paths() { git rev-parse "${@/#/HEAD:}" | git hash-object --stdin; }

        # Assigned before echoing so a failing hash_paths stops the step (bash -e -o pipefail).
        icons=$(hash_paths packages/icons pnpm-lock.yaml .nvmrc)
        # Components reads tokens (Tailwind preset, theme CSS) and resolves icons imports via its package.json.
        components=$(hash_paths packages/components packages/tokens/dist packages/icons/package.json pnpm-lock.yaml .nvmrc)

        echo "icons=$icons" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"

    - name: Restore Fondue Icons build
      id: icons-cache
      if: inputs.icons == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        # src/icons is generated by the build and read by the icons lint/typecheck.
        path: |
          packages/icons/dist
          packages/icons/src/icons
        key: build-icons-v1-${{ runner.os }}-${{ steps.keys.outputs.icons }}

    - name: Build Fondue Icons
      if: inputs.icons == 'true' && steps.icons-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm build:icons

    - name: Restore Fondue Components build
      id: components-cache
      if: inputs.components == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: packages/components/dist
        key: build-components-v1-${{ runner.os }}-${{ steps.keys.outputs.components }}

    - name: Build Fondue Components
      if: inputs.components == 'true' && steps.components-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm build:components
