packages:
    - packages/*
    - fondue
    - storybook-docs

allowBuilds:
    "@bundled-es-modules/glob": true
    "@parcel/watcher": true
    cypress: true
    esbuild: true
    style-dictionary: true
    unrs-resolver: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - "@frontify/*"
    # This bump takes in-range releases that are still inside the age cutoff.
    - "@axe-core/playwright"
    - "@storybook/*"
    - "@types/estree"
    - "@types/node"
    - "@types/react"
    - "caniuse-lite"
    - "electron-to-chromium"
    - "figma-api"
    - "ignore"
    - "storybook"
    - "systeminformation"
    - "tinyexec"

publicHoistPattern:
    - "*eslint*"
    - "*prettier*"
    - "*tailwind*"
    - "*oxlint*"
    - "*storybook*"

confirmModulesPurge: false
